# Combined logs match the guest collector parser.
server {
    listen 10.0.0.11:80 default_server;
    server_name _;
    server_tokens off;
    root /var/www/soc-lab;
    index index.html;
    access_log /var/log/nginx/access.log combined;
    error_log /var/log/nginx/error.log;
    allow 10.0.0.12;
    allow 10.0.0.11;
    deny all;
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
}

# Guest -> Nginx -> SSH reverse tunnel -> local SOC backend.
server {
    listen 127.0.0.1:8000;
    server_name localhost;
    server_tokens off;
    access_log off;
    location /api/vm/ {
        proxy_pass http://127.0.0.1:18000;
        proxy_set_header Host localhost;
    }
    location = /health { proxy_pass http://127.0.0.1:18000; }
    location / { return 404; }
}
